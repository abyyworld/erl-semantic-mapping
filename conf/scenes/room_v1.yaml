# room_v1 — the reference scene.
#
# 6.4 x 6.4 x 2.4 m at 10 cm resolution. Ten box-shaped objects sit in an
# annulus around the centre so the orbiting sensor sees each of them from a
# restricted range of directions; that restriction is what lets viewpoint-
# correlated detector error accumulate instead of averaging out.
#
# Changing anything here changes every number in results/. The suite checks in
# `erl-map check` are what tell you whether the change broke the benchmark.

seed: 0
grid: [64, 64, 24]
voxel_size: 0.1
n_objects: 10

# Trajectory: 12 waypoints on a 2 m orbit, panning through 4 headings at each.
# The pan is what gives the walls and floor coverage; the orbit is what gives
# the central objects parallax.
n_waypoints: 12
yaws_per_waypoint: 4
orbit_radius: 2.0
camera_height: 1.2

# 48x36 at 90 degrees horizontal. Small on purpose: the finding is about how
# errors correlate across views, and it survives at any resolution, so there is
# no reason to make CI pay for a megapixel.
image_width: 48
image_height: 36
hfov_deg: 90.0
max_range: 8.0

# What the mapper believes about its own detector. Held fixed across the sweep
# so that fusion is never quietly handed the true noise model.
assumed_accuracy: 0.7
